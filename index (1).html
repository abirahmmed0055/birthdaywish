<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#39ff7a;
    --bg:#020a05;
    --rose:#ff6b8b;
    --cream:#fff4ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  body{font-family:'Fira Code',monospace;color:var(--green)}

  /* ---------- HACK SCREEN ---------- */
  #hack{
    position:fixed;inset:0;background:var(--bg);z-index:10;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));
    transition:opacity .9s ease, filter .9s ease;
  }
  #hack.out{opacity:0;filter:blur(6px) brightness(2);pointer-events:none}
  #rain{position:absolute;inset:0;width:100%;height:100%;opacity:.35}
  #term{position:relative;font-size:clamp(11px,3.2vw,15px);line-height:1.7;
    max-height:70%;overflow:hidden;text-shadow:0 0 6px rgba(57,255,122,.6)}
  #term .dim{opacity:.6}
  #term .warn{color:#ffd24a}
  #term .ok{color:#7dffb0}
  .cursor{display:inline-block;width:.6em;height:1em;background:var(--green);
    vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #barwrap{position:relative;margin-top:16px}
  #barlabel{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
  #bar{height:10px;border:1px solid var(--green);border-radius:2px;overflow:hidden}
  #fill{height:100%;width:0;background:var(--green);box-shadow:0 0 12px var(--green)}
  #granted{
    position:absolute;left:0;right:0;top:38%;text-align:center;
    font-weight:600;font-size:clamp(22px,7vw,42px);letter-spacing:.08em;
    color:var(--green);text-shadow:0 0 18px var(--green);opacity:0;
  }
  #granted.show{opacity:1;animation:glitch .35s steps(2) 3}
  @keyframes glitch{
    0%{transform:translate(0)} 25%{transform:translate(-4px,2px)}
    50%{transform:translate(4px,-2px)} 75%{transform:translate(-2px,-1px)} 100%{transform:translate(0)}
  }

  /* ---------- BIRTHDAY SCREEN ---------- */
  #wish{
    position:fixed;inset:0;z-index:5;
    display:flex;align-items:center;justify-content:center;text-align:center;
    background:#1a0a10;overflow:hidden;
  }
  #photo{
    position:absolute;inset:0;background:url('photo.jpg') center/cover no-repeat;
    opacity:0;transform:scale(1.08);
    filter:saturate(.9) blur(.5px);
    transition:opacity 2.5s ease, transform 14s ease;
  }
  #wish.on #photo{opacity:.28;transform:scale(1)}
  #veil{position:absolute;inset:0;
    background:radial-gradient(ellipse at center, rgba(26,10,16,.15) 0%, rgba(26,10,16,.85) 85%)}
  #hearts{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .heart{position:absolute;bottom:-40px;color:var(--rose);opacity:0;
    animation:rise linear forwards}
  @keyframes rise{
    0%{transform:translateY(0) scale(.6);opacity:0}
    10%{opacity:.7}
    100%{transform:translateY(-110vh) scale(1.2);opacity:0}
  }
  #content{position:relative;padding:24px;max-width:640px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    opacity:0;transform:translateY(14px);transition:opacity 1.6s ease .6s, transform 1.6s ease .6s}
  #wish.on #content{opacity:1;transform:none}
  h1{font-family:'Great Vibes',cursive;font-weight:400;color:var(--cream);
    font-size:clamp(54px,17vw,110px);line-height:1;
    text-shadow:0 0 28px rgba(255,107,139,.65), 0 2px 0 rgba(0,0,0,.3)}
  .sub{margin-top:14px;font-family:'Playfair Display',serif;font-style:italic;
    font-size:clamp(18px,5vw,26px);color:#ffd3dc}
  .msg{margin-top:26px;font-family:'Playfair Display',serif;font-size:clamp(15px,4.2vw,19px);
    line-height:1.85;color:var(--cream);max-width:34ch;margin-left:auto;margin-right:auto}
  .date{margin-top:28px;font-family:'Playfair Display',serif;font-size:15px;color:#ffb3c2}

  @media (prefers-reduced-motion:reduce){
    .heart{display:none}
    #photo{transition:opacity 1s ease}
  }
</style>
</head>
<body>

<!-- Hacking intro (10 seconds) -->
<div id="hack">
  <canvas id="rain"></canvas>
  <div id="granted">ACCESS GRANTED</div>
  <div id="term"></div>
  <div id="barwrap">
    <div id="barlabel"><span id="barmsg">Hacking in progress...</span><span id="pct">0%</span></div>
    <div id="bar"><div id="fill"></div></div>
  </div>
</div>

<!-- Birthday wish -->
<div id="wish">
  <div id="photo"></div>
  <div id="veil"></div>
  <div id="hearts"></div>
  <div id="content">
    <h1>Happy Birthday</h1>
    <p class="sub" id="name">Jaan ❤</p>
    <p class="msg">
      Tumi amar jibon er sob cheye sundor upohar.
      Tumi pashe thakle prithibi ta shundor lage.
      Allah tomake sob shomoy shukhi rakhuk, ar ami jeno protita din tomar pashe thakte pari.
      I love you, aaj ar protidin. ❤
    </p>
    <p class="date">3 October</p>
  </div>
</div>

<script>
/* ====== EDIT HERE ====== */
const HER_NAME = "Jaan ❤";        // tar nam ba dak-nam eikhane likho
const HACK_SECONDS = 10;          // hacking screen koto second thakbe
/* ======================= */

document.getElementById('name').textContent = HER_NAME;

/* --- Matrix rain --- */
const cv = document.getElementById('rain'), cx = cv.getContext('2d');
let cols, drops, fs = 16;
function sizeRain(){
  cv.width = innerWidth; cv.height = innerHeight;
  cols = Math.floor(cv.width / fs);
  drops = Array.from({length: cols}, () => Math.random() * -50);
}
sizeRain(); addEventListener('resize', sizeRain);
const glyphs = '01ABCDEF<>{}#$%&*+=';
let rainOn = true;
function rain(){
  if(!rainOn) return;
  cx.fillStyle = 'rgba(2,10,5,.14)';
  cx.fillRect(0,0,cv.width,cv.height);
  cx.fillStyle = '#39ff7a'; cx.font = fs + 'px Fira Code, monospace';
  for(let i=0;i<cols;i++){
    cx.fillText(glyphs[Math.floor(Math.random()*glyphs.length)], i*fs, drops[i]*fs);
    if(drops[i]*fs > cv.height && Math.random() > .975) drops[i] = 0;
    drops[i]++;
  }
  setTimeout(()=>requestAnimationFrame(rain), 55);
}
rain();

/* --- Fake terminal log --- */
const lines = [
  ['> initializing hack.exe ...', ''],
  ['> connecting to target device', 'dim'],
  ['> target found: MY LOVE ❤', 'ok'],
  ['> bypassing firewall ...', 'warn'],
  ['> cracking password ******', 'warn'],
  ['> access to heart: DENIED', 'warn'],
  ['> retrying with love.exe ...', ''],
  ['> downloading smile.dat', 'dim'],
  ['> uploading surprise.mp4', 'dim'],
  ['> password found: ILOVEYOU', 'ok'],
  ['> system hacked successfully', 'ok'],
];
const term = document.getElementById('term');
const fill = document.getElementById('fill');
const pct  = document.getElementById('pct');
const barmsg = document.getElementById('barmsg');
const total = HACK_SECONDS * 1000;
const start = performance.now();
let shown = 0;

function tick(now){
  const t = Math.min((now - start) / total, 1);
  const p = Math.floor(t * 100);
  fill.style.width = p + '%';
  pct.textContent = p + '%';

  const want = Math.floor(t * (lines.length + 1) * 0.92);
  while(shown < Math.min(want, lines.length)){
    const d = document.createElement('div');
    if(lines[shown][1]) d.className = lines[shown][1];
    d.textContent = lines[shown][0];
    term.appendChild(d);
    shown++;
  }
  if(t < 1){ requestAnimationFrame(tick); } else { finish(); }
}
requestAnimationFrame(tick);

function finish(){
  barmsg.textContent = 'Done';
  document.getElementById('granted').classList.add('show');
  setTimeout(()=>{
    document.getElementById('hack').classList.add('out');
    document.getElementById('wish').classList.add('on');
    startHearts();
    setTimeout(()=>{ rainOn = false; document.getElementById('hack').style.display='none'; }, 1000);
  }, 1100);
}

/* --- Floating hearts --- */
function startHearts(){
  const box = document.getElementById('hearts');
  setInterval(()=>{
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = Math.random() > .3 ? '❤' : '♡';
    h.style.left = Math.random()*100 + '%';
    h.style.fontSize = (12 + Math.random()*22) + 'px';
    h.style.animationDuration = (6 + Math.random()*6) + 's';
    box.appendChild(h);
    setTimeout(()=>h.remove(), 13000);
  }, 700);
}
</script>
</body>
</html>
